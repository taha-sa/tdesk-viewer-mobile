name: OTA update
on:
  workflow_dispatch:
    inputs:
      message:
        description: Update message
        required: true
  push:
    branches: ['release/*']
permissions:
  contents: read
jobs:
  ota:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: JS-only guard (base = last v* tag)
        run: node scripts/check-js-only.js
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish OTA
        env:
          MSG: ${{ github.event.inputs.message || github.event.head_commit.message }}
        run: eas update --channel preview --message "$MSG" --non-interactive
