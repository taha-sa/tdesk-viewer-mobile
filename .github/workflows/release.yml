name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build APK
        run: eas build -p android --profile preview --non-interactive --wait --json > build.json
      - name: Download APK and publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          URL=$(node -e "const b=JSON.parse(require('fs').readFileSync('build.json','utf8'));const x=Array.isArray(b)?b[0]:b;console.log(x.artifacts.buildUrl)")
          VER="${TAG#v}"
          APK="tdesk-viewer-${VER}.apk"
          curl -fsSL "$URL" -o "$APK"
          gh release create "$TAG" "$APK" --repo taha-sa/tdesk-viewer-releases --title "$TAG" --notes "T-Desk Viewer $TAG"
